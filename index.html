<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <!-- font from the style guide-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Leaflet map library: styles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css">
  <!-- Leaflet map library: code (loads before script.js) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <title>Frontend Mentor | IP Address Tracker</title>
</head>

<body>
  <!-- Title and search bar -->
  <header class="hero">
    <h1>IP Address Tracker</h1>
    <form id="search-form" class="search">
      <input type="text" id="search-input" class="search-input" aria-label="Enter an IP address or domain">
      <button type="submit" class="search-button" aria-label="Search for IP Address">
        <img src="./images/icon-arrow.svg" alt="">
      </button>
    </form>
    <!-- Empty until a search fails; screen readers announce it -->
    <p id="error-message" class="error-message" role="alert"></p>
  </header>
  <main>
    <!-- Results card, filled in by script.js -->
    <section class="info-container">

      <div class="result">
        <h2 class="result-label">IP Address</h2>
        <p id="ip-address" class="result-value">192.212.174.101</p>
      </div>

      <div class="divider"></div>

      <div class="result">
        <h2 class="result-label">Location</h2>
        <p id="location" class="result-value">Brooklyn, NY<br>10001</p>
      </div>
      <div class="divider"></div>

      <div class="result">
        <h2 class="result-label">Timezone</h2>
        <p id="timezone" class="result-value">UTC-05:00</p>
      </div>

      <div class="divider"></div>

      <div class="result">
        <h2 class="result-label">ISP</h2>
        <p id="isp" class="result-value">SpaceX<br>Starlink</p>
      </div>

    </section>
    <!-- Leaflet draws the map here -->
    <div id="map"></div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>
    Coded by <a href="https://github.com/aubrey-strauss">Aubrey Strauss</a>
  </footer>
  <script src="script.js" defer></script>
</body>

</html>
