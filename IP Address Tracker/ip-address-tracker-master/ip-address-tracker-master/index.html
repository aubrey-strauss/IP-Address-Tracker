<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <!-- font from the style guide-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | IP Address Tracker</title>
</head>

<body>
  <header class="hero">
    <h1>IP Address Tracker</h1>
    <form id="search-form" class="search">
      <input type="text" id="search-input" class="search-input" placeholder="Search for any IP address or domain">
      <button type="submit" class="search-button" aria-label="Search for IP Address">
        <img src="./images/icon-arrow.svg" alt="">
      </button>
    </form>
  </header>
  <main>
    <section class="info-container">
      <div class="result">
        <h2 class="result-label">IP Address</h2>
        <p id="ip-address" class="result-value">192.212.174.101</p>
      </div>
      <div class="result">
        <h2 class="result-label">Location</h2>
        <p id="location" class="result-value">Brooklyn, NY 10001</p>
      </div>
      <div class="result">
        <h2 class="result-label">Timezone</h2>
        <p id="timezone" class="result-value">UTC-05:00</p>
      </div>
      <div class="result">
        <h2 class="result-label">ISP</h2>
        <p id="isp" class="result-value">SpaceX Starlink</p>
      </div>
    </section>
    <div id="map"></div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Aubrey Strauss</a>.
  </footer>
  <script src="script.js" defer></script>
</body>

</html>
